overrides:
  # Security: GHSA-2883-xcg3-v3hh (js-yaml < 4.3.2, high)
  'js-yaml@<4.3.2': '4.3.2'
  # Security: GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-5jgf-p345-68v8 (fast-uri < 3.1.6, high)
  #           GHSA-58mr-gqgx-xq4g (fast-uri 3.1.6, host confusion via unclosed bracket in the URI authority)
  #           GHSA-hrr3-gc8f-f4qj (fast-uri < 3.1.8, inconsistent host case normalization)
  #           GHSA-333x-w4r6-6crp + scheme-spoofing/host-confusion/path-equivalence advisories
  #           (fast-uri < 3.1.9, moderate/low)
  'fast-uri@<3.1.9': '3.1.9'
  # Security: GHSA-9rgm-9g3h-6x36 (devalue < 5.9.2, DoS via malformed input)
  #           GHSA-r9w8-h9r3-54w4, GHSA-j22f-vq7h-c4qm, GHSA-mcm9-63f2-9j32,
  #           GHSA-x5rw-q4pp-hg5g (devalue <= 5.9.2, uneval/ArrayBuffer issues)
  'devalue@<5.9.3': '5.9.3'
  # Security: qs DoS advisories (patched in 6.16.0, moderate)
  'qs@<6.16.0': '6.16.0'
  # Security: GHSA-q2hr-2g5m-vwhr (brace-expansion quadratic DoS, patched in 5.0.12)
  'brace-expansion@<5.0.12': '5.0.12'
  # Security: GHSA-253c-mchw-3w2r (markdown-it linkify quadratic DoS, patched in 14.3.1)
  #           GHSA-gfr2-rv44-r23c, GHSA-r7fv-28h4-cvq7, GHSA-vfgh-jcmw-g37q
  #           (markdown-it < 14.3.3, quadratic parsing DoS)
  'markdown-it@<14.3.3': '14.3.3'
  # Security: GHSA-cg2g-xh64-v4q7 (dompurify <= 3.4.16, critical SAFE_FOR_TEMPLATES bypass),
  #           GHSA-p98j-92pf-mc4p (dompurify IN_PLACE hook issue)
  'dompurify@<3.4.17': '3.4.17'
  # Security: GHSA-gfhx-hw2g-v5hg (serialize-javascript < 7.1.2, XSS via unescaped </script>)
  #           plus a follow-up XSS advisory fixed in 7.1.3
  'serialize-javascript@<7.1.3': '7.1.3'
  # Security: GHSA-rj75-hqrm-r3gf (postcss-selector-parser < 7.1.6, quadratic selector parsing)
  'postcss-selector-parser@<7.1.6': '7.1.6'
  # Security: GHSA-68fv-2mgg-jv7q (source-map-js < 1.2.2, event-loop DoS)
  'source-map-js@<1.2.2': '1.2.2'
  # Security: undici batch — GHSA-pmjh-fq2x-6v4x (orphaned RetryHandler body),
  # GHSA-r53p-7pc4-xj5r (response splitting), GHSA-2jfj-6hjv-fm6j (Set-Cookie
  # cross-user disclosure), GHSA-2gqq-gqf2-x968 (chunked response truncation),
  # GHSA-w293-vg96-wgc3 (TLS validation bypass in BalancedPool),
  # GHSA-8436-99hf-9mmv (unsafe-method response caching),
  # GHSA-vp8m-p9jh-q5pm (cross-origin cache poisoning). Patched in 7.29.1 / 8.10.2.
  # Plus newer unhandled-error/unbounded-decompression/SRI-bypass advisories,
  # patched in 7.30.1 / 8.12.2.
  'undici@^7.0.0': '7.30.1'
  'undici@^8.0.0': '8.12.2'
  # Security: KaTeX prototype-pollution trust bypass (katex < 0.18.2, low)
  'katex@<0.18.2': '0.18.2'
  # Security: zod memory exhaustion on oversized input (zod < 4.6.6, high)
  'zod@<4.6.6': '4.6.6'
  # Security: MSAL Node auth-code flow disclosure (@azure/msal-node < 7.1.0, high).
  # Note: @azure/identity declares msal-node ^5/6, so this override goes beyond
  # its range (dev-only via vsce packaging; verify `pnpm package` at release).
  '@azure/msal-node@<7.1.0': '7.1.0'

# Single source of truth for postinstall build-script approvals (pnpm 10+;
# supersedes onlyBuiltDependencies). Keep every entry that exists in the
# dependency tree — removing one makes pnpm skip (and warn about) its build
# scripts, which breaks e.g. esbuild and the vsce signing flow.
allowBuilds:
  '@google/genai': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  koffi: true
  protobufjs: true
