overrides:
  # Security: GHSA-2883-xcg3-v3hh (js-yaml < 4.3.2, high)
  'js-yaml@<4.3.2': '4.3.2'
  # Security: GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-5jgf-p345-68v8 (fast-uri < 3.1.6, high)
  #           GHSA-58mr-gqgx-xq4g (fast-uri 3.1.6, host confusion via unclosed bracket in the URI authority)
  #           GHSA-hrr3-gc8f-f4qj (fast-uri < 3.1.8, inconsistent host case normalization)
  'fast-uri@<3.1.8': '3.1.8'
  # Security: GHSA-9rgm-9g3h-6x36 (devalue < 5.9.2, DoS via malformed input)
  'devalue@<5.9.2': '5.9.2'
  # Security: qs DoS advisories (patched in 6.16.0, moderate)
  'qs@<6.16.0': '6.16.0'
  # Security: GHSA-q2hr-2g5m-vwhr (brace-expansion quadratic DoS, patched in 5.0.12)
  'brace-expansion@<5.0.12': '5.0.12'
  # Security: GHSA-253c-mchw-3w2r (markdown-it linkify quadratic DoS, patched in 14.3.1)
  'markdown-it@<14.3.1': '14.3.1'
  # Security: undici batch — GHSA-pmjh-fq2x-6v4x (orphaned RetryHandler body),
  # GHSA-r53p-7pc4-xj5r (response splitting), GHSA-2jfj-6hjv-fm6j (Set-Cookie
  # cross-user disclosure), GHSA-2gqq-gqf2-x968 (chunked response truncation),
  # GHSA-w293-vg96-wgc3 (TLS validation bypass in BalancedPool),
  # GHSA-8436-99hf-9mmv (unsafe-method response caching),
  # GHSA-vp8m-p9jh-q5pm (cross-origin cache poisoning). Patched in 7.29.1 / 8.10.2.
  'undici@^7.0.0': '7.29.1'
  'undici@^8.0.0': '8.10.2'

# Single source of truth for postinstall build-script approvals (pnpm 10+;
# supersedes onlyBuiltDependencies). Keep every entry that exists in the
# dependency tree — removing one makes pnpm skip (and warn about) its build
# scripts, which breaks e.g. esbuild and the vsce signing flow.
allowBuilds:
  '@google/genai': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  koffi: true
  protobufjs: true
