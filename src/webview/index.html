<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP notes — this tag is AUTHORITATIVE: the extension host substitutes
      webview.cspSource for 'self' at load time and must NOT strip this meta.
      - script-src 'self' (+ host-injected nonce): no inline handlers or inline
        scripts are used, except the single nonce'd media-globals script the
        host injects into <head> at load time.
      - connect-src ('self' + registry.npmjs.org) covers the two registry
        fetches PiPackagesPanel makes (/latest and /-/v1/search); the panel
        degrades gracefully when a fetch is blocked (fetch throws TypeError).
      - base-uri 'self' and form-action 'self' don't fall back to default-src;
        without them injected <base>/<form> tags in rendered content could
        hijack relative URLs / exfiltrate data.
      - style-src keeps 'unsafe-inline' because Svelte injects component styles;
        img-src allows data: for inline base64 message images but NOT a bare
        `https:` wildcard — rendered message content could otherwise pull
        tracking pixels from arbitrary hosts and leak that the webview is open.
        Residual risks (currently UNMITIGATED in the renderer, CSP can't help):
        data: URIs are unbounded — no size/content-type cap is applied to host-
        provided images today, and blocked remote images render a broken-image
        icon with no placeholder (no <img> error handler exists).
    -->
    <!-- FORMAT CONTRACT (host-side rewrite is regex-based and silently no-ops
         on a mismatch — see getWebviewContent in src/pi-agent-provider.ts):
         1. `http-equiv` must appear BEFORE `content` in this tag.
         2. Origin placeholders must be the literal quoted token 'self'.
         3. `script-src` must stay a single directive ending with `;` (the host
            injects the nonce into the first script-src occurrence).
         A reformat that breaks any of these ships a webview with no nonce and
         no cspSource: the media-globals script is blocked and icons silently
         disappear. realhost-webview-csp.test.ts guards the built output. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://registry.npmjs.org; font-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none';"
    />
    <title>PiLot Studio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
