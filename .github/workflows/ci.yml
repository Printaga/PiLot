name: CI

on:
    push:
        branches: [main]
    pull_request: null

# Least privilege: the verify job only reads the repository to check out,
# install, test, and build. No write scopes are required.
permissions:
    contents: read

# Cancel superseded runs on the same ref (rapid re-pushes, PR updates) so a
# 30-minute verify job isn't queued/running several times per commit.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  # Full history so the Fallow audit can diff against the default branch.
                  fetch-depth: 0
                  # PR code runs in later steps; never leave the job token in
                  # .git/config where untrusted scripts could read it.
                  persist-credentials: false

            # Third-party action: pinned to a full commit SHA (tags are mutable).
            # a8198c4bff370c8506180b035930dea56dbd5288 = v5
            - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
              with:
                  # Read from packageManager in package.json (11.8.0) so the
                  # toolchain can't drift from the lockfile.
                  package_json_file: package.json

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check (tsc + svelte-check)
              run: pnpm run check

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            # The REALHOST webview CSP suite boots the SHIPPED webview
            # (dist/webview/index.html), so the build must run before the test
            # stages — the same stage order `pnpm verify:full` uses. The full
            # build also produces the extension bundle that test:e2e needs.
            - name: Build
              run: pnpm run build

            - name: Unit tests (plain Node, no VS Code host)
              run: pnpm test:unit

            - name: Webview component tests (plain Node + jsdom)
              run: pnpm run test:webview

            - name: Fallow audit
              run: pnpm run fallow:audit

            # The VS Code integration suite opens an Electron window; the runner
            # has no display, so xvfb must be installed or the suite cannot start.
            # Guarded so an apt mirror hiccup at the END of a run cannot fail an
            # otherwise fully-passing verification.
            - name: Install xvfb
              run: |
                  if ! command -v xvfb-run >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb
                  fi

            - name: E2E tests (VS Code integration suite)
              run: pnpm test:e2e

            # DIAGNOSTIC (E2E hang investigation): keep the per-run VS Code logs
            # and upload them when the suite fails, so the extension host's own
            # view of workspace-folder adds and git-extension discovery can be
            # read post-mortem instead of guessed at.
            - name: Collect VS Code logs on failure
              if: failure()
              run: |
                  mkdir -p vscode-logs
                  find /tmp -maxdepth 1 -name 'pilot-test-userdata-*' -type d -mmin -30 \
                      -exec cp -r {} vscode-logs/ \;
                  ls -la vscode-logs/ || true

            - name: Upload VS Code logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: vscode-logs-${{ github.run_id }}
                  path: vscode-logs/
                  retention-days: 5
