name: CI

on:
    push:
        branches: [main]
    pull_request:

# Least privilege: the verify job only reads the repository to check out,
# install, test, and build. No write scopes are required.
permissions:
    contents: read

# Cancel superseded runs on the same ref (rapid re-pushes, PR updates) so a
# 30-minute verify job isn't queued/running several times per commit.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  # Full history so the Fallow audit can diff against the default branch.
                  fetch-depth: 0

            - uses: pnpm/action-setup@v5
              with:
                  # Read from packageManager in package.json (11.8.0) so the
                  # toolchain can't drift from the lockfile.
                  package_json_file: package.json

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check (tsc + svelte-check)
              run: pnpm run check

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            # The REALHOST webview CSP suite boots the SHIPPED webview
            # (dist/webview/index.html), so the build must run before the test
            # stages — the same stage order `pnpm verify:full` uses. The full
            # build also produces the extension bundle that test:e2e needs.
            - name: Build
              run: pnpm run build

            - name: Unit tests (plain Node, no VS Code host)
              run: pnpm test:unit

            - name: Webview component tests (plain Node + jsdom)
              run: pnpm run test:webview

            - name: Fallow audit
              run: pnpm run fallow:audit

            # The VS Code integration suite opens an Electron window; the runner
            # has no display, so xvfb must be installed or the suite cannot start.
            - name: Install xvfb
              run: sudo apt-get update && sudo apt-get install -y xvfb

            - name: E2E tests (VS Code integration suite)
              run: pnpm test:e2e
